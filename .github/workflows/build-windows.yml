name: Windows derlemesi

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: pip install -r requirements-dev.txt

      - name: Testleri çalıştır
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --cov=tirnak_uyarici --cov-fail-under=80

      - name: .exe üret (kullanıcıların çalıştırdığı build_windows.bat ile)
        shell: cmd
        timeout-minutes: 20
        run: build_windows.bat

      - name: Zip'le
        shell: pwsh
        run: Compress-Archive -Path dist/TirnakUyarici -DestinationPath TirnakUyarici-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TirnakUyarici-windows
          path: TirnakUyarici-windows.zip
